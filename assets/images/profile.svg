<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd5b8" />
      <stop offset="100%" stop-color="#f5be9b" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50" />
      <stop offset="100%" stop-color="#1a252f" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="200" fill="url(#bgGrad)" />

  <!-- Inner Soft Glow Background -->
  <circle cx="200" cy="200" r="185" fill="#ffffff" opacity="0.12" />

  <!-- Body / Clothes -->
  <path d="M90 380 C 100 290, 150 270, 200 270 C 250 270, 300 290, 310 380 Z" fill="url(#shirtGrad)" />
  <!-- Shirt Collar Detail -->
  <polygon points="175,270 200,310 225,270" fill="#ffffff" opacity="0.9" />

  <!-- Neck -->
  <rect x="178" y="225" width="44" height="55" rx="8" fill="url(#skinGrad)" />

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="65" ry="75" fill="url(#skinGrad)" />

  <!-- Hair Back/Base -->
  <path d="M130 180 C 130 95, 270 95, 270 180 C 270 140, 260 110, 200 110 C 140 110, 130 140, 130 180 Z" fill="url(#hairGrad)" />

  <!-- Hair Front Bangs -->
  <path d="M135 155 C 150 125, 200 120, 265 145 C 250 135, 220 130, 195 135 C 165 140, 150 150, 135 155 Z" fill="url(#hairGrad)" />

  <!-- Glasses Frame -->
  <rect x="150" y="165" width="40" height="26" rx="6" fill="none" stroke="#1e293b" stroke-width="4.5" />
  <rect x="210" y="165" width="40" height="26" rx="6" fill="none" stroke="#1e293b" stroke-width="4.5" />
  <line x1="190" y1="178" x2="210" y2="178" stroke="#1e293b" stroke-width="4.5" />
  <!-- Glasses Highlights -->
  <line x1="155" y1="172" x2="168" y2="172" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <line x1="215" y1="172" x2="228" y2="172" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Eyes behind glasses -->
  <circle cx="170" cy="178" r="4.5" fill="#1e293b" />
  <circle cx="230" cy="178" r="4.5" fill="#1e293b" />

  <!-- Eyebrows -->
  <path d="M152 154 Q 170 148 188 154" fill="none" stroke="#2c3e50" stroke-width="3.5" stroke-linecap="round" />
  <path d="M212 154 Q 230 148 248 154" fill="none" stroke="#2c3e50" stroke-width="3.5" stroke-linecap="round" />

  <!-- Smile -->
  <path d="M182 215 Q 200 230 218 215" fill="none" stroke="#d97706" stroke-width="3.5" stroke-linecap="round" />

  <!-- Cheeks Blush -->
  <circle cx="152" cy="205" r="10" fill="#f43f5e" opacity="0.25" />
  <circle cx="248" cy="205" r="10" fill="#f43f5e" opacity="0.25" />
</svg>
