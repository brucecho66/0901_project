<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="개발과 기술, 실전 경험을 기록하는 개인 기술 블로그입니다.">
  <title>Dev.Blog | 기술 블로그 & 게시글 목록</title>

  <!-- Pretendard Web Font CDN -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/blog.css">
</head>
<body>

  <!-- 공통 헤더 렌더링 영역 -->
  <div id="blogHeader"></div>

  <!-- 메인 블로그 컨텐츠 -->
  <main class="blog-main">
    
    <!-- 블로그 히어로 / 소개 배너 -->
    <section class="blog-hero">
      <div class="container">
        <div class="blog-hero-inner">
          <div class="blog-hero-content">
            <div class="blog-hero-badge">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
              <span>Personal Tech Blog</span>
            </div>
            <h1 class="blog-hero-title">생각과 코드를 기록하는<br><span>기술 아카이브</span></h1>
            <p class="blog-hero-desc">
              웹 프론트엔드 최적화, 모던 JavaScript 아키텍처, 디자인 시스템 구축 경험과 배움의 과정을 공유합니다.
            </p>
          </div>

          <!-- 블로그 운영자 미니 프로필 카드 -->
          <div class="blog-hero-author-card" id="heroAuthorCard">
            <img src="assets/images/profile.svg" alt="홍길동" class="hero-author-avatar">
            <div class="hero-author-info">
              <h4 id="heroAuthorName">홍길동 (DevLog)</h4>
              <p id="heroAuthorBio">문제를 집요하게 해결하는 풀스택 웹 개발자</p>
              <div class="hero-author-links">
                <a href="profile.html" class="hero-author-btn">프로필 보기</a>
                <a href="https://github.com/brucecho66" target="_blank" rel="noopener noreferrer" class="hero-author-btn">GitHub</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 게시글 목록 및 검색 섹션 -->
    <div class="container">
      <div class="blog-controls">
        <!-- 검색창 -->
        <div class="blog-search-wrapper">
          <svg class="search-input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="searchInput" class="blog-search-input" placeholder="관심 있는 기술 주제, 제목, 태그를 검색해 보세요..." autocomplete="off">
          <button id="searchClearBtn" class="search-clear-btn" aria-label="검색어 지우기">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>

        <!-- 카테고리 필터 & 정렬 옵션 -->
        <div class="blog-filter-row">
          <div class="category-pills" id="categoryPills">
            <button class="category-pill active" data-category="all">전체보기</button>
            <button class="category-pill" data-category="프론트엔드">프론트엔드</button>
            <button class="category-pill" data-category="개발">개발</button>
            <button class="category-pill" data-category="UI/UX">UI/UX</button>
            <button class="category-pill" data-category="회고">회고</button>
          </div>

          <div style="display: flex; align-items: center; gap: 0.6rem;">
            <div class="blog-sort-wrapper">
              <select id="sortSelect" class="blog-sort-select" aria-label="게시글 정렬">
                <option value="latest">최신 등록순</option>
                <option value="popular">조회수 인기순</option>
                <option value="likes">좋아요 추천순</option>
                <option value="comments">댓글 많은순</option>
              </select>
            </div>
            <a href="post-write.html" class="btn btn-sm btn-primary" title="새 글 작성" style="white-space: nowrap; gap: 0.35rem;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              <span>글쓰기</span>
            </a>
          </div>
        </div>
      </div>

      <!-- 게시글 카드 그리드 -->
      <div class="posts-grid" id="postsGrid">
        <!-- 자바스크립트로 동적 렌더링 -->
      </div>
    </div>

    <!-- 플로팅 글쓰기 버튼 -->
    <a href="post-write.html" class="floating-write-btn" id="floatingWriteBtn" title="새 글 작성">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      <span>새 글 쓰기</span>
    </a>
  </main>

  <!-- 공통 푸터 렌더링 영역 -->
  <div id="blogFooter"></div>

  <!-- Scripts -->
  <script src="js/store.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. 공통 헤더/푸터 렌더링
      BlogCommon.renderHeader('posts');
      BlogCommon.renderFooter();

      // 2. 블로그 상태 변수
      let currentCategory = 'all';
      let currentSearch = '';
      let currentSort = 'latest';

      const postsGrid = document.getElementById('postsGrid');
      const searchInput = document.getElementById('searchInput');
      const searchClearBtn = document.getElementById('searchClearBtn');
      const categoryPills = document.getElementById('categoryPills');
      const sortSelect = document.getElementById('sortSelect');

      // 3. 게시글 목록 렌더링 함수
      function renderPosts() {
        const posts = BlogStore.queryPosts({
          category: currentCategory,
          search: currentSearch,
          sort: currentSort
        });

        if (posts.length === 0) {
          postsGrid.innerHTML = `
            <div class="posts-empty-state">
              <div class="empty-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></polyline><line x1="8" y1="12" x2="16" y2="12"></line></svg>
              </div>
              <h3 class="empty-title">일치하는 게시글이 없습니다</h3>
              <p class="empty-desc">다른 검색어를 입력하시거나 카테고리 필터를 변경해 보세요.</p>
              <button id="resetFilterBtn" class="btn btn-sm btn-secondary">전체 글 보기</button>
            </div>
          `;
          const resetBtn = document.getElementById('resetFilterBtn');
          if (resetBtn) {
            resetBtn.addEventListener('click', () => {
              currentCategory = 'all';
              currentSearch = '';
              searchInput.value = '';
              searchClearBtn.style.display = 'none';
              document.querySelectorAll('.category-pill').forEach(p => p.classList.toggle('active', p.dataset.category === 'all'));
              renderPosts();
            });
          }
          return;
        }

        postsGrid.innerHTML = posts.map(post => {
          const dateStr = BlogStore.formatDate(post.createdAt);
          const readTime = BlogStore.calculateReadingTime(post.content);
          const commentsCount = post.comments ? post.comments.length : 0;
          const tagsHtml = (post.tags || []).map(t => `<span class="post-tag">#${t}</span>`).join('');

          return `
            <a href="post-detail.html?id=${post.id}" class="post-card">
              <div class="post-card-thumb-wrapper">
                <div class="post-card-thumb-pattern"></div>
                <div class="post-card-thumb-icon">
                  <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                </div>
                <span class="post-category-badge">${post.category || '개발'}</span>
              </div>
              <div class="post-card-body">
                <div class="post-card-meta-top">
                  <span class="post-card-date">${dateStr}</span>
                  <span class="post-card-dot"></span>
                  <span>${readTime} 소요</span>
                </div>
                <h3 class="post-card-title">${post.title}</h3>
                <p class="post-card-excerpt">${post.excerpt || ''}</p>
                <div class="post-card-tags">
                  ${tagsHtml}
                </div>
                <div class="post-card-footer">
                  <div class="post-author-mini">
                    <img src="${post.authorAvatar || 'assets/images/profile.svg'}" alt="${post.authorName}">
                    <span>${post.authorName}</span>
                  </div>
                  <div class="post-card-stats">
                    <span class="stat-item" title="조회수">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                      ${post.views || 0}
                    </span>
                    <span class="stat-item" title="좋아요">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                      ${post.likes || 0}
                    </span>
                    <span class="stat-item" title="댓글">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                      ${commentsCount}
                    </span>
                  </div>
                </div>
              </div>
            </a>
          `;
        }).join('');
      }

      // 4. 이벤트 바인딩 (검색)
      searchInput.addEventListener('input', (e) => {
        currentSearch = e.target.value;
        searchClearBtn.style.display = currentSearch ? 'block' : 'none';
        renderPosts();
      });

      searchClearBtn.addEventListener('click', () => {
        searchInput.value = '';
        currentSearch = '';
        searchClearBtn.style.display = 'none';
        renderPosts();
        searchInput.focus();
      });

      // 5. 카테고리 필터 클릭
      categoryPills.addEventListener('click', (e) => {
        const btn = e.target.closest('.category-pill');
        if (!btn) return;

        document.querySelectorAll('.category-pill').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.category;
        renderPosts();
      });

      // 6. 정렬 변경
      sortSelect.addEventListener('change', (e) => {
        currentSort = e.target.value;
        renderPosts();
      });

      // 초기 렌더링
      renderPosts();
    });
  </script>
</body>
</html>
