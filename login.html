<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="로그인 - Dev.Blog">
  <title>로그인 | Dev.Blog</title>

  <!-- Pretendard Web Font CDN -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/blog.css">
</head>
<body>

  <!-- 공통 헤더 -->
  <div id="blogHeader"></div>

  <!-- 메인 로그인 컨텐츠 -->
  <main class="blog-main">
    <div class="container">
      <div class="auth-wrapper">
        <div class="auth-card">

          <div class="auth-header">
            <div class="auth-icon-badge">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
            </div>
            <h1 class="auth-title">로그인</h1>
            <p class="auth-subtitle">Dev.Blog에 오신 것을 환영합니다</p>
          </div>

          <!-- 로그인 폼 -->
          <form id="loginForm" class="auth-form">
            <div>
              <label for="loginEmail" class="editor-label">이메일 계정</label>
              <div class="input-with-icon">
                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                <input type="email" id="loginEmail" class="input-field" placeholder="example@domain.com" required autocomplete="username">
              </div>
            </div>

            <div>
              <label for="loginPassword" class="editor-label">비밀번호</label>
              <div class="input-with-icon">
                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                <input type="password" id="loginPassword" class="input-field" placeholder="••••••••" required autocomplete="current-password">
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
              <span>로그인</span>
            </button>
          </form>

          <!-- 1초 빠른 체험 로그인 -->
          <div class="auth-quick-login-box">
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.75rem;">
              별도 가입 없이 전체 기능을 바로 둘러보시겠어요?
            </p>
            <button type="button" id="quickDemoBtn" class="quick-demo-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
              <span>운영자(홍길동) 체험 계정으로 1초 로그인</span>
            </button>
          </div>

          <!-- 회원가입 링크 안내 -->
          <div class="auth-switch-prompt">
            아직 계정이 없으신가요? <a href="signup.html">회원가입하기</a>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- 공통 푸터 -->
  <div id="blogFooter"></div>

  <!-- Scripts -->
  <script src="js/store.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      BlogCommon.renderHeader('login');
      BlogCommon.renderFooter();

      const urlParams = new URLSearchParams(window.location.search);
      const redirectTarget = urlParams.get('redirect') || 'index.html';

      // 이미 로그인되어 있는 경우 리다이렉트
      if (BlogStore.getCurrentUser()) {
        window.location.href = redirectTarget;
        return;
      }

      // 일반 폼 로그인
      const form = document.getElementById('loginForm');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        const res = BlogStore.login(email, password);
        if (res.success) {
          BlogCommon.toast(`${res.user.name}님, 환영합니다!`, 'success');
          setTimeout(() => {
            window.location.href = redirectTarget;
          }, 500);
        } else {
          BlogCommon.toast(res.message || '로그인에 실패했습니다.', 'error');
        }
      });

      // 1초 체험 로그인
      document.getElementById('quickDemoBtn').addEventListener('click', () => {
        const res = BlogStore.quickLogin();
        if (res.success) {
          BlogCommon.toast(`${res.user.name} 체험 계정으로 로그인되었습니다!`, 'success');
          setTimeout(() => {
            window.location.href = redirectTarget;
          }, 500);
        }
      });
    });
  </script>
</body>
</html>
