<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="게시글 상세 페이지 - Dev.Blog">
  <title>게시글 상세 | Dev.Blog</title>

  <!-- Fonts (Pretendard & Gaegu 손글씨체) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/blog.css">
</head>
<body>

  <!-- 공통 헤더 -->
  <div id="blogHeader"></div>

  <!-- 메인 상세 컨텐츠 영역 -->
  <main class="blog-main">
    <div class="container">
      <div class="post-detail-wrapper" id="postDetailContainer">
        <!-- 로딩 또는 자바스크립트 렌더링 -->
      </div>
    </div>
  </main>

  <!-- 공통 푸터 -->
  <div id="blogFooter"></div>

  <!-- Scripts -->
  <script src="js/store.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      BlogCommon.renderHeader('posts');
      BlogCommon.renderFooter();

      const container = document.getElementById('postDetailContainer');
      const urlParams = new URLSearchParams(window.location.search);
      const postId = urlParams.get('id');

      if (!postId) {
        renderNotFound('게시글 ID가 지정되지 않았습니다.');
        return;
      }

      const post = BlogStore.getPostById(postId);
      if (!post) {
        renderNotFound('요청하신 게시글을 찾을 수 없거나 삭제되었습니다.');
        return;
      }

      // 조회수 1 증가
      BlogStore.incrementPostViews(postId);
      post.views = (post.views || 0) + 1;

      // 페이지 타이틀 변경
      document.title = `${post.title} | Dev.Blog`;

      // 렌더링 실행
      renderPostDetail(post);

      function renderNotFound(msg) {
        container.innerHTML = `
          <div class="posts-empty-state">
            <div class="empty-icon">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></polyline><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            </div>
            <h2 class="empty-title">게시글을 찾을 수 없습니다</h2>
            <p class="empty-desc">${msg}</p>
            <a href="index.html" class="btn btn-primary">글 목록으로 돌아가기</a>
          </div>
        `;
      }

      function renderPostDetail(p) {
        const currentUser = BlogStore.getCurrentUser();
        const isAuthor = currentUser && (currentUser.id === p.authorId || currentUser.role === 'author');
        const hasLiked = BlogStore.checkUserLiked(p.id);
        const tagsHtml = (p.tags || []).map(t => `<span class="post-tag">#${t}</span>`).join('');
        const renderedHtmlContent = BlogStore.renderMarkdown(p.content);
        const dateStr = BlogStore.formatNaverDate ? BlogStore.formatNaverDate(p.createdAt) : BlogStore.formatDate(p.createdAt);

        container.innerHTML = `
          <!-- 상단 내비게이션 바 & 01.PNG 우측 더보기(3단 점) 옵션 메뉴 -->
          <div class="naver-post-top-bar">
            <a href="index.html" class="back-link">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
              <span>목록으로</span>
            </a>

            <!-- 01.PNG 스타일 3개 점 옵션 버튼 및 드롭다운 -->
            <div class="naver-post-options-wrap">
              <button id="postOptionsBtn" class="naver-post-more-btn" aria-label="게시글 옵션 더보기" title="더보기">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                  <circle cx="12" cy="5" r="1.8"></circle>
                  <circle cx="12" cy="12" r="1.8"></circle>
                  <circle cx="12" cy="19" r="1.8"></circle>
                </svg>
              </button>
              <div id="postOptionsMenu" class="naver-options-dropdown">
                ${isAuthor ? `
                  <a href="post-write.html?id=${p.id}" class="naver-dropdown-item">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                    <span>글 수정</span>
                  </a>
                  <button id="deletePostBtn" class="naver-dropdown-item item-danger">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    <span>글 삭제</span>
                  </button>
                  <div class="naver-dropdown-divider"></div>
                ` : ''}
                <button id="copyUrlDropdownBtn" class="naver-dropdown-item">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                  <span>링크 복사</span>
                </button>
              </div>
            </div>
          </div>

          <!-- 01.PNG 스타일 네이버 블로그 상세 카드 -->
          <div class="naver-post-detail-card">
            <!-- 01.PNG 일치 중앙 정렬 포스트 헤더 -->
            <header class="naver-card-header">
              <div class="naver-post-category">${p.category || '포켓몬카드'}</div>
              <h1 class="naver-post-handwriting-title">${p.title}</h1>

              <div class="naver-author-block-centered">
                <img src="${p.authorAvatar || 'assets/images/gyutaku_profile.png'}" alt="${p.authorName}" class="naver-author-avatar-circle">
                <div class="naver-author-name-text">${p.authorName}</div>
                <div class="naver-author-date-text">${dateStr}</div>
                <div class="naver-green-accent-line"></div>
              </div>
            </header>

            <!-- 본문 컨텐츠 (Markdown 렌더링) -->
            <article class="post-detail-content naver-post-content-body">
              ${renderedHtmlContent}
            </article>

            <!-- 태그 목록 -->
            <div class="post-detail-tags">
              ${tagsHtml}
            </div>

            <!-- 01.PNG 하단 인터랙션 바 (댓글, 비행기 공유, 공감) -->
            <div class="naver-post-bottom-bar">
              <div class="naver-bottom-left-actions">
                <button id="scrollToCommentsBtn" class="naver-interaction-icon-btn" title="댓글 보기">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <circle cx="12" cy="12" r="9.5"></circle>
                    <circle cx="8" cy="12" r="1.1" fill="currentColor"></circle>
                    <circle cx="12" cy="12" r="1.1" fill="currentColor"></circle>
                    <circle cx="16" cy="12" r="1.1" fill="currentColor"></circle>
                  </svg>
                </button>
                <button id="shareBtn" class="naver-interaction-icon-btn" title="공유하기 / 링크 복사">
                  <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                  </svg>
                  <span class="naver-icon-counter">1</span>
                </button>
              </div>

              <div class="naver-bottom-right-actions">
                <button id="likeBtn" class="naver-sympathy-btn ${hasLiked ? 'liked' : ''}" aria-label="이 글 공감하기">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="${hasLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                  </svg>
                  <span>공감</span>
                  <span id="likeCountSpan">${p.likes || 0}</span>
                </button>
              </div>
            </div>
          </div>

          <!-- 작성자 소개 카드 -->
          <div class="author-profile-card">
            <img src="${p.authorAvatar || 'assets/images/gyutaku_profile.png'}" alt="${p.authorName}" class="author-card-avatar">
            <div class="author-card-content">
              <h3>작성자: ${p.authorName}</h3>
              <p>포켓몬카드 · 굿즈 · 피규어 · 서브컬처 취미와 일상을 기록하는 규타쿠의 오타쿠 활동로그 블로그입니다.</p>
              <div style="margin-top: 0.75rem;">
                <a href="profile.html" class="btn btn-sm btn-secondary">작성자 프로필 보기</a>
              </div>
            </div>
          </div>

          <!-- 댓글 섹션 -->
          <section class="comments-section" id="commentsSection">
            <h3 class="comments-header">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
              <span>댓글 <span id="commentsCount">${p.comments ? p.comments.length : 0}</span></span>
            </h3>

            <!-- 댓글 작성 폼 -->
            <div class="comment-form-card">
              <form id="commentForm">
                ${!currentUser ? `
                  <div class="comment-form-top">
                    <input type="text" id="commentAuthorInput" class="comment-name-input" placeholder="닉네임 (미입력 시 익명)" maxlength="15">
                  </div>
                ` : `
                  <div class="comment-form-top">
                    <span class="user-profile-badge">
                      <img src="${currentUser.avatar || 'assets/images/gyutaku_profile.png'}" class="header-avatar" alt="">
                      <strong>${currentUser.name}</strong> 님으로 댓글 작성
                    </span>
                  </div>
                `}
                <textarea id="commentContentInput" class="comment-textarea" placeholder="건전한 피드백과 소통을 환영합니다..." required></textarea>
                <div class="comment-form-bottom">
                  <button type="submit" class="btn btn-primary">댓글 등록</button>
                </div>
              </form>
            </div>

            <!-- 댓글 리스트 -->
            <div class="comments-list" id="commentsList">
              <!-- 동적 렌더링 -->
            </div>
          </section>
        `;

        bindDetailEvents(p);
        renderComments(p);
      }

      function bindDetailEvents(p) {
        // 더보기(3단 점) 드롭다운 토글
        const optionsBtn = document.getElementById('postOptionsBtn');
        const optionsMenu = document.getElementById('postOptionsMenu');
        if (optionsBtn && optionsMenu) {
          optionsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            optionsMenu.classList.toggle('active');
          });
          document.addEventListener('click', (e) => {
            if (!optionsMenu.contains(e.target) && e.target !== optionsBtn) {
              optionsMenu.classList.remove('active');
            }
          });
        }

        // 댓글 위치로 스크롤 이동
        const scrollToCommentsBtn = document.getElementById('scrollToCommentsBtn');
        if (scrollToCommentsBtn) {
          scrollToCommentsBtn.addEventListener('click', () => {
            const commentsEl = document.getElementById('commentsSection');
            if (commentsEl) {
              commentsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          });
        }

        // 좋아요 토글
        const likeBtn = document.getElementById('likeBtn');
        const likeCountSpan = document.getElementById('likeCountSpan');

        if (likeBtn) {
          likeBtn.addEventListener('click', () => {
            const res = BlogStore.togglePostLike(p.id);
            if (res.success) {
              likeCountSpan.textContent = res.likes;
              if (res.hasLiked) {
                likeBtn.classList.add('liked');
                likeBtn.querySelector('svg').setAttribute('fill', 'currentColor');
                BlogCommon.toast('이 글에 공감했습니다! ♥', 'success');
              } else {
                likeBtn.classList.remove('liked');
                likeBtn.querySelector('svg').setAttribute('fill', 'none');
                BlogCommon.toast('공감을 취소했습니다.', 'info');
              }
            }
          });
        }

        // 공유 링크 복사 핸들러 함수
        const handleCopyLink = () => {
          const currentUrl = window.location.href;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(currentUrl).then(() => {
              BlogCommon.toast('게시글 주소가 클립보드에 복사되었습니다!', 'success');
            });
          } else {
            BlogCommon.toast('주소: ' + currentUrl, 'info');
          }
          if (optionsMenu) optionsMenu.classList.remove('active');
        };

        const shareBtn = document.getElementById('shareBtn');
        if (shareBtn) {
          shareBtn.addEventListener('click', handleCopyLink);
        }

        const copyUrlDropdownBtn = document.getElementById('copyUrlDropdownBtn');
        if (copyUrlDropdownBtn) {
          copyUrlDropdownBtn.addEventListener('click', handleCopyLink);
        }

        // 삭제 버튼 이벤트
        const deletePostBtn = document.getElementById('deletePostBtn');
        if (deletePostBtn) {
          deletePostBtn.addEventListener('click', () => {
            if (confirm('정말로 이 게시글을 삭제하시겠습니까? 삭제된 글은 복구할 수 없습니다.')) {
              const res = BlogStore.deletePost(p.id);
              if (res.success) {
                BlogCommon.toast('게시글이 삭제되었습니다.', 'info');
                setTimeout(() => {
                  window.location.href = 'index.html';
                }, 600);
              } else {
                BlogCommon.toast(res.message || '삭제에 실패했습니다.', 'error');
              }
            }
          });
        }

        // 댓글 등록 폼 이벤트
        const commentForm = document.getElementById('commentForm');
        if (commentForm) {
          commentForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const contentInput = document.getElementById('commentContentInput');
            const authorInput = document.getElementById('commentAuthorInput');

            const content = contentInput.value.trim();
            if (!content) return;

            const authorName = authorInput ? authorInput.value.trim() : null;

            const res = BlogStore.addComment(p.id, {
              content,
              authorName
            });

            if (res.success) {
              BlogCommon.toast('댓글이 등록되었습니다.', 'success');
              contentInput.value = '';
              const updatedPost = BlogStore.getPostById(p.id);
              renderComments(updatedPost);
            } else {
              BlogCommon.toast(res.message || '댓글 등록 실패', 'error');
            }
          });
        }
      }

      function renderComments(p) {
        const commentsList = document.getElementById('commentsList');
        const commentsCount = document.getElementById('commentsCount');
        const comments = p.comments || [];
        commentsCount.textContent = comments.length;

        if (comments.length === 0) {
          commentsList.innerHTML = `
            <div style="text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.95rem;">
              아직 작성된 댓글이 없습니다. 첫 번째 댓글의 주인공이 되어보세요!
            </div>
          `;
          return;
        }

        const currentUser = BlogStore.getCurrentUser();

        commentsList.innerHTML = comments.map(c => {
          const cDate = BlogStore.formatDate(c.createdAt);
          const canDelete = currentUser && (currentUser.id === c.authorId || currentUser.id === p.authorId || currentUser.role === 'author');

          return `
            <div class="comment-item">
              <img src="${c.authorAvatar || 'assets/images/profile.svg'}" alt="${c.authorName}" class="comment-avatar">
              <div class="comment-content-box">
                <div class="comment-header-row">
                  <span class="comment-author-name">${c.authorName}</span>
                  <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <span class="comment-date">${cDate}</span>
                    ${canDelete ? `
                      <button class="comment-delete-btn" data-comment-id="${c.id}">삭제</button>
                    ` : ''}
                  </div>
                </div>
                <div class="comment-text">${c.content}</div>
              </div>
            </div>
          `;
        }).join('');

        // 댓글 삭제 이벤트 바인딩
        commentsList.querySelectorAll('.comment-delete-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const commentId = e.target.dataset.commentId;
            if (confirm('댓글을 삭제하시겠습니까?')) {
              const res = BlogStore.deleteComment(p.id, commentId);
              if (res.success) {
                BlogCommon.toast('댓글이 삭제되었습니다.', 'info');
                const updatedPost = BlogStore.getPostById(p.id);
                renderComments(updatedPost);
              } else {
                BlogCommon.toast(res.message || '삭제 권한이 없습니다.', 'error');
              }
            }
          });
        });
      }
    });
  </script>
</body>
</html>
