<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="회원가입 - Dev.Blog">
  <title>회원가입 | Dev.Blog</title>

  <!-- Fonts (Pretendard & Gaegu) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/blog.css">
</head>
<body>

  <!-- 공통 헤더 -->
  <div id="blogHeader"></div>

  <!-- 메인 회원가입 컨텐츠 -->
  <main class="blog-main">
    <div class="container">
      <div class="auth-wrapper">
        <div class="auth-card">

          <div class="auth-header">
            <div class="auth-icon-badge" style="background: transparent;">
              <span class="naver-blog-icon" style="width: 48px; height: 48px; font-size: 1.6rem; border-radius: 10px;">N</span>
            </div>
            <h1 class="auth-title">회원가입</h1>
            <p class="auth-subtitle">규타쿠의 오타쿠 활동로그 블로그에 오신 것을 환영합니다</p>
          </div>

          <!-- 회원가입 폼 -->
          <form id="signupForm" class="auth-form">
            <div>
              <label for="signupName" class="editor-label">닉네임 / 이름 *</label>
              <div class="input-with-icon">
                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <input type="text" id="signupName" class="input-field" placeholder="규타쿠" required autocomplete="name">
              </div>
            </div>

            <div>
              <label for="signupEmail" class="editor-label">이메일 계정 *</label>
              <div class="input-with-icon">
                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                <input type="email" id="signupEmail" class="input-field" placeholder="user@example.com" required autocomplete="username">
              </div>
            </div>

            <div>
              <label for="signupPassword" class="editor-label">비밀번호 *</label>
              <div class="input-with-icon">
                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                <input type="password" id="signupPassword" class="input-field" placeholder="6자리 이상 비밀번호 입력" required minlength="6" autocomplete="new-password">
              </div>
            </div>

            <div>
              <label for="signupPasswordConfirm" class="editor-label">비밀번호 확인 *</label>
              <div class="input-with-icon">
                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
                <input type="password" id="signupPasswordConfirm" class="input-field" placeholder="비밀번호를 다시 입력하세요" required minlength="6" autocomplete="new-password">
              </div>
              <div id="passwordMismatchMsg" class="input-helper-text" style="color: var(--danger); display: none;">비밀번호가 일치하지 않습니다.</div>
            </div>

            <div>
              <label for="signupBio" class="editor-label">한 줄 자기소개 (선택)</label>
              <div class="input-with-icon">
                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                <input type="text" id="signupBio" class="input-field" placeholder="프론트엔드 개발자 지망생입니다!">
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
              <span>가입 완료하고 시작하기</span>
            </button>
          </form>

          <!-- 로그인 링크 안내 -->
          <div class="auth-switch-prompt">
            이미 계정이 있으신가요? <a href="login.html">로그인하기</a>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- 공통 푸터 -->
  <div id="blogFooter"></div>

  <!-- Scripts -->
  <script src="js/store.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      BlogCommon.renderHeader('signup');
      BlogCommon.renderFooter();

      // 이미 로그인된 경우 리다이렉트
      if (BlogStore.getCurrentUser()) {
        window.location.href = 'index.html';
        return;
      }

      const form = document.getElementById('signupForm');
      const passInput = document.getElementById('signupPassword');
      const passConfirmInput = document.getElementById('signupPasswordConfirm');
      const mismatchMsg = document.getElementById('passwordMismatchMsg');

      passConfirmInput.addEventListener('input', () => {
        if (passConfirmInput.value && passInput.value !== passConfirmInput.value) {
          mismatchMsg.style.display = 'block';
        } else {
          mismatchMsg.style.display = 'none';
        }
      });

      const submitBtn = form.querySelector('button[type="submit"]');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('signupName').value.trim();
        const email = document.getElementById('signupEmail').value.trim();
        const password = passInput.value;
        const passwordConfirm = passConfirmInput.value;
        const bio = document.getElementById('signupBio').value.trim();

        if (password !== passwordConfirm) {
          mismatchMsg.style.display = 'block';
          passConfirmInput.focus();
          return;
        }

        const originalBtnText = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>가입 처리 중...</span>';

        try {
          const res = await BlogStore.signup({
            name,
            email,
            password,
            bio
          });

          if (res.success) {
            BlogCommon.toast(`환영합니다, ${res.user.name}님! 회원가입이 완료되었습니다.`, 'success');
            setTimeout(() => {
              window.location.href = 'profile.html';
            }, 120);
          } else {
            BlogCommon.toast(res.message || '회원가입에 실패했습니다.', 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalBtnText;
          }
        } catch (err) {
          BlogCommon.toast('회원가입 처리 중 오류가 발생했습니다.', 'error');
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalBtnText;
        }
      });
    });
  </script>
</body>
</html>
